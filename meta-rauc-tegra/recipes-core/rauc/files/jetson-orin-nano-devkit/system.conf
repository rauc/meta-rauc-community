[system]
compatible=@MACHINE@
bootloader=custom
bundle-formats=-plain
data-directory=@DATA_MOUNT_POINT@/rauc

[handlers]
bootloader-custom-backend=/usr/libexec/rauc-nvbootctrl-backend

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/APP
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/APP_b
type=ext4
bootname=B
